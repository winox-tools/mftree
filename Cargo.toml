[package]
name = "mftree"
version = "0.1.0"
edition = "2021"
description = "Fast NTFS volume scanner that parses the $MFT directly: top files and folders, tree, search, JSON/CSV output"
license = "MIT"
repository = "https://github.com/winox-tools/mftree"
readme = "README.md"
keywords = ["ntfs", "mft", "disk-usage", "windows", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1"
regex = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Console",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
